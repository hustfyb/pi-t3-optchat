name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in bin/* install.sh tests/smoke.sh; do
            bash -n "$f"
            echo "ok: $f"
          done

      - name: Smoke tests
        run: tests/smoke.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -S warning bin/pi-t3 bin/pi-t3-doctor \
            bin/pi-t3-patch-optchat install.sh tests/smoke.sh
